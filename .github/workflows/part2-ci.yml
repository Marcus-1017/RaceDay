name: Part 2 Build and Test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore Part2/RaceDay.slnx

      - name: Build solution
        run: dotnet build Part2/RaceDay.slnx --no-restore

      - name: Run unit tests
        run: dotnet test Part2/RaceDay.slnx --no-build
